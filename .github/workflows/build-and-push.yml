name: Build & push container images to GHCR

# Builds three Docker images (backend, nginx-full-stack, bot) on every push
# to master, tags them with both `latest` and the commit SHA, and pushes
# to GitHub Container Registry (ghcr.io). UzCloud / Coolify / any other
# platform can pull these images via the Docker Registry option.

on:
  push:
    branches: [master]
  workflow_dispatch:  # manual trigger from the GH Actions UI

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: nginx
            context: .
            dockerfile: ./nginx/Dockerfile
          - name: bot
            context: ./bot
            dockerfile: ./bot/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: lc
        run: echo "owner=$(echo '${{ env.IMAGE_OWNER }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/uzassets-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/uzassets-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to:   type=gha,scope=${{ matrix.name }},mode=max
          platforms: linux/amd64
