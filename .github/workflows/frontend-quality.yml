name: Frontend quality (type-check)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  vue-tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Type-error budget gate (vue-tsc -b)
        working-directory: frontend
        # Бюджет-гейт на АВТОРИТЕТНОМ `vue-tsc -b` (сильный build-режим, в отличие
        # от слабого --noEmit, который на этом проекте почти ничего не ловит).
        # Падает ТОЛЬКО при РОСТЕ ошибок сверх зафиксированного бюджета (56 на
        # 2026-07-22, аудит здоровья кода) — останавливает накопление, не требуя
        # разовой зачистки всех. Бюджет только снижать; цель — 0, затем блокировка
        # на нуле. См. frontend/scripts/tsc-budget.mjs.
        run: node scripts/tsc-budget.mjs
