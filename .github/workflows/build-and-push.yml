name: Build & push container images to GHCR

# Builds three Docker images (backend, nginx-full-stack, bot) on every push
# to master, tags them with both `latest` and the commit SHA, and pushes
# to GitHub Container Registry (ghcr.io). UzCloud / Coolify / any other
# platform can pull these images via the Docker Registry option.

on:
  push:
    branches: [master]
    tags: ['v*.*.*']   # семвер-тег vX.Y.Z → релиз в прод (образы :X.Y.Z + :stable)
  workflow_dispatch:  # manual trigger from the GH Actions UI

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: nginx
            context: .
            dockerfile: ./nginx/Dockerfile
          - name: bot
            context: ./bot
            dockerfile: ./bot/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: lc
        run: echo "owner=$(echo '${{ env.IMAGE_OWNER }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Тег-стратегия (Release Manager):
      #   push в master  → latest + sha-short    (staging авто-деплоит :latest)
      #   тег vX.Y.Z     → X.Y.Z + X.Y + stable  (прод деплоит :stable / :vX.Y.Z)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/uzassets-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to:   type=gha,scope=${{ matrix.name }},mode=max
          platforms: linux/amd64
