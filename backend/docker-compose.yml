# =====================================================================
# UzAssets Platform — Docker Compose
#
# Profiles:
#   default        — postgres + backend + frontend (dev mode, 5173 + 8000)
#   production     — adds nginx (TLS) + backup (cron pg_dump + GPG)
#
# Run:
#   docker compose up -d --build                       # dev
#   docker compose --profile production up -d --build  # full stack
# =====================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: uza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-uza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uza_dev_pass_change_me}
      POSTGRES_DB:       ${POSTGRES_DB:-uzassets}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Postgres listens only on the internal Docker network — never on the host.
    # If you need a SQL client from your laptop, expose with a tunneled port:
    #   docker compose exec postgres psql -U uza -d uzassets
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uza} -d ${POSTGRES_DB:-uzassets}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uza-net
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-1.5}'
          memory: '${POSTGRES_MEM_LIMIT:-1G}'
        reservations:
          cpus: '0.25'
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uza-backend
    restart: unless-stopped
    environment:
      # Runtime connection uses the least-privilege `uza_app` role: DML on
      # all tables BUT no DDL and no UPDATE/DELETE on audit_log. Falls back
      # to the original `uza` superuser if APP_DB_* env vars are unset
      # (for first-boot / dev mode before setup-db-users.sh has been run).
      DATABASE_URL:      postgresql+asyncpg://${APP_DB_USER:-${POSTGRES_USER:-uza}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:-uza_dev_pass_change_me}}@postgres:5432/${POSTGRES_DB:-uzassets}
      DATABASE_URL_SYNC: postgresql+psycopg://${APP_DB_USER:-${POSTGRES_USER:-uza}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:-uza_dev_pass_change_me}}@postgres:5432/${POSTGRES_DB:-uzassets}
      # Admin URL (Alembic migrations only) — preserved superuser access.
      DATABASE_URL_ADMIN: postgresql+psycopg://${POSTGRES_USER:-uza}:${POSTGRES_PASSWORD:-uza_dev_pass_change_me}@postgres:5432/${POSTGRES_DB:-uzassets}

      # JWT (RS256 by default; keys mounted from ./backend/keys)
      JWT_ALGORITHM:           ${JWT_ALGORITHM:-RS256}
      JWT_PRIVATE_KEY_PATH:    /app/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH:     /app/keys/jwt_public.pem
      JWT_SECRET:              ${JWT_SECRET:-change_me_only_used_when_alg_is_HS256}
      JWT_ISSUER:              ${JWT_ISSUER:-uzassets-platform}
      JWT_AUDIENCE:            ${JWT_AUDIENCE:-uzassets-platform}
      JWT_EXPIRE_MINUTES:      ${JWT_EXPIRE_MINUTES:-30}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-14}

      # Password policy
      PASSWORD_MIN_LENGTH:     ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_HISTORY_SIZE:   ${PASSWORD_HISTORY_SIZE:-5}
      PASSWORD_MAX_AGE_DAYS:   ${PASSWORD_MAX_AGE_DAYS:-90}
      BCRYPT_ROUNDS:           ${BCRYPT_ROUNDS:-12}

      # Lockout / sessions
      LOGIN_MAX_FAILED_ATTEMPTS:      ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES:          ${LOGIN_LOCKOUT_MINUTES:-30}
      SESSION_IDLE_TIMEOUT_MINUTES:   ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      SESSION_ABSOLUTE_TIMEOUT_HOURS: ${SESSION_ABSOLUTE_TIMEOUT_HOURS:-12}

      # Field encryption / audit integrity
      FERNET_KEY_PATH:        /app/keys/fernet.key
      AUDIT_HMAC_SECRET_PATH: /app/keys/audit_hmac.key
      AUDIT_RETENTION_DAYS:   ${AUDIT_RETENTION_DAYS:-1825}
      # Required by app.core.encryption (Fernet for telegram_chat_id, MFA codes etc.)
      MFA_ENCRYPTION_KEY:     ${MFA_ENCRYPTION_KEY:-}

      # Rate limit
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH:    ${RATE_LIMIT_AUTH:-60/minute}
      RATE_LIMIT_API:     ${RATE_LIMIT_API:-300/minute}
      RATE_LIMIT_HEAVY:   ${RATE_LIMIT_HEAVY:-30/minute}

      # Network
      CORS_ORIGINS:           ${CORS_ORIGINS:-http://localhost:5173,http://localhost,https://localhost,https://uz-assets040,https://platform.uz-assets.uz}
      TRUSTED_HOSTS:          ${TRUSTED_HOSTS:-localhost,127.0.0.1,backend,uza-backend,nginx,uz-assets040,platform.uz-assets.uz}
      FORCE_HTTPS:            ${FORCE_HTTPS:-false}
      HSTS_MAX_AGE_SECONDS:   ${HSTS_MAX_AGE_SECONDS:-31536000}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-26214400}

      # AI
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # AI engine model tiers — real provider ids resolved from environment
      AI_MODEL_BALANCED: ${AI_MODEL_BALANCED:-}
      AI_MODEL_DEEP: ${AI_MODEL_DEEP:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT:-ai-balanced}

      # Telegram (Pack 147 / Phase A+B+C: bot callbacks + banner URLs + TWA HMAC)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-UzAssets_bot}
      BOT_CALLBACK_SECRET:  ${BOT_CALLBACK_SECRET:-}
      PLATFORM_URL: ${PLATFORM_URL:-https://platform.uz-assets.uz}
      TWA_INITDATA_MAX_AGE_SECONDS: ${TWA_INITDATA_MAX_AGE_SECONDS:-86400}

      # Dev-only MFA bypass — refuses to activate if is_production=True.
      # Leave UNSET on VM. Set to 1 in local .env to skip MFA second step.
      DEV_DISABLE_MFA: ${DEV_DISABLE_MFA:-}

      # Misc
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL:   ${LOG_LEVEL:-INFO}
      LOG_FORMAT:  ${LOG_FORMAT:-json}
      PYTHONPATH:  /app
    volumes:
      - ./backend:/app
      - ./backend/keys:/app/keys:ro
      - backend_uploads:/app/uploads
      # Pack 150: TLS certs — shared с nginx (там mounted as :ro в /etc/nginx/certs)
      - ./nginx/certs:/app/certs
    expose:
      - "8000"
    # Backend port is NOT published to the host by default — all access
    # goes through nginx (port 80/443). For local debugging without nginx,
    # uncomment the ports block below.
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uza-net
    # `--reload` only in dev. For production deploys override via:
    #   COMPOSE_BACKEND_CMD='uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=172.16.0.0/12'
    command: ${COMPOSE_BACKEND_CMD:-uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*}
    # Container hardening (Pack 148, P3):
    # - no-new-privileges blocks setuid binaries from escalating to root
    # - cap_drop:ALL removes Linux capabilities; we re-add only NET_BIND_SERVICE
    #   (uvicorn binds to 8000 — non-privileged port — so even that is moot,
    #   listed for completeness if you switch to port <1024)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Telegram bot (outbox worker + MFA link handler) ───
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: uza-tg-bot
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-uza}:${POSTGRES_PASSWORD:-uza_dev_pass_change_me}@postgres:5432/${POSTGRES_DB:-uzassets}}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-uza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uza_dev_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-uzassets}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-UzAssets_bot}
      BOT_CALLBACK_SECRET: ${BOT_CALLBACK_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      PLATFORM_URL: ${PLATFORM_URL:-https://platform.uz-assets.uz}
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://backend:8000}
      BOT_LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
      OUTBOX_POLL_SEC: ${OUTBOX_POLL_SEC:-2.0}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_MAX_RETRIES: ${OUTBOX_MAX_RETRIES:-5}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uza-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ─── uza-frontend REMOVED ───
  # The Vue bundle is now built INTO the nginx image via multi-stage
  # Dockerfile (stage 1 = node:20 + `vite build`, stage 2 = nginx static).
  # Saves one running container, ~250 MB RAM, one network hop.
  #
  # To redeploy after Vue changes:
  #   docker compose --profile production build nginx
  #   docker compose --profile production up -d nginx
  # (Previously: `docker exec uza-frontend npx vite build && docker restart uza-frontend`)

  # ─── uza-frontend-twa REMOVED ───
  # Telegram Mini App bundle is now built INTO the nginx image via a
  # second build-stage (`twa-builder`). Lives at /usr/share/nginx/html/twa,
  # served by `location /twa/` (alias) — no proxy_pass needed.
  # Saves one more container.
  #
  # To redeploy TWA after changes:
  #   docker compose --project-directory . -f backend/docker-compose.yml \
  #     --profile production build nginx
  #   docker compose --project-directory . -f backend/docker-compose.yml \
  #     --profile production up -d --force-recreate nginx

  # =================================================================
  # Production profile — TLS edge proxy + scheduled encrypted backups
  # =================================================================
  nginx:
    profiles: ["production"]
    build:
      # Context = project root because multi-stage Dockerfile builds the
      # frontend bundle (stage 1) and bakes /usr/share/nginx/html (stage 2).
      # `.` resolves to project root because compose is invoked with
      # `--project-directory .` from the project root.
      context: .
      dockerfile: nginx/Dockerfile
    container_name: uza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - uza-net
    security_opt:
      - no-new-privileges:true
    # nginx needs NET_BIND_SERVICE only — bind 80/443 (<1024).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE

  # ─── backup service removed (Pack 150 cleanup) ───
  # Прежнее объявление ссылалось на `./scripts/backup/Dockerfile`,
  # которого нет в репозитории — это блокировало `--profile production`.
  # Резервное копирование сейчас вне scope; когда понадобится — вернуть
  # как отдельный compose файл (docker-compose.backup.yml) с собственным
  # Dockerfile в `scripts/backup/`.

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  nginx_logs:
    driver: local

networks:
  uza-net:
    driver: bridge
