# ====================================================================
# Alembic configuration for UzAssets Platform
# ====================================================================

[alembic]
script_location = alembic

# Tell Alembic to prepend the current directory (containing alembic.ini) to
# sys.path. This is what makes `from app.config import settings` resolve
# inside alembic/env.py when running `alembic upgrade head` as a console script.
prepend_sys_path = .

# Tells Alembic which DB URL to use — overridden by env.py from settings
sqlalchemy.url = postgresql+psycopg://uza:uza_dev_pass@postgres:5432/uzassets

# Naming convention for auto-generated revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use a single timezone for revision timestamps
timezone = UTC

# Truncate long slug names
truncate_slug_length = 40

# Output formatting
output_encoding = utf-8

[post_write_hooks]
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
