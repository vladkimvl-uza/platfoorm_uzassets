name: Frontend quality (type-check)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  vue-tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Type-check (vue-tsc)
        working-directory: frontend
        # Non-blocking: в кодовой базе ~40+ накопленных тип-ошибок (legacy:
        # CreditPortfolio/ExecDash/Financials…). Гейт показывает их в логах,
        # но не валит деплой. Снять continue-on-error после разбора долга.
        continue-on-error: true
        run: npx vue-tsc --noEmit -p tsconfig.app.json
