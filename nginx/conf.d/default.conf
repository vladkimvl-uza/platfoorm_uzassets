# --- HTTP → HTTPS redirect ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /__nginx_health__ {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/dev-privkey.pem;

    # ---- Security headers (defense in depth — backend also sets these) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    # ---- Connection caps (DoS mitigation) ----
    limit_conn conn_per_ip 50;

    # ---- Health pass-through ----
    location = /healthz { return 200 "ok\n"; }

    # ---- API: rate-limited, proxy to FastAPI ----
    # ---- AI streaming SSE: no buffering, long timeouts ----
    location /api/ai/ {
        proxy_pass         http://backend:8000/ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;

        # SSE-specific
        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        proxy_set_header   Connection        '';
        chunked_transfer_encoding off;
    }

    # ---- Backend WebSocket endpoints (Pack 11.0 notifications, future broadcasts) ----
    # Regex location — matches BEFORE general /api/ prefix. Adds Upgrade/Connection
    # headers so FastAPI sees a real WebSocket handshake instead of plain HTTP GET (404).
    location ~ ^/api/(notifications|broadcasts|admin-broadcasts)/ws {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Request-ID      $http_x_request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Auth endpoints: tight rate-limit ----
    location ~ ^/api/auth/(login-mfa|verify-mfa|login|refresh|logout|forgot|reset)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass         http://backend:8000/auth/$1;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Request-ID      $http_x_request_id;
        # No caching of auth responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
    }

    # ---- Heavy operations (reports, exports) ----
    location ~ ^/api/(reports|export)/ {
        limit_req zone=heavy_zone burst=10 nodelay;
        proxy_pass         http://backend:8000/$1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Request-ID      $http_x_request_id;
        proxy_read_timeout 300s;
    }

    # ---- Frontend SPA + Vite HMR WebSocket ----
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Vite HMR over WebSocket: only switch into upgrade mode when the
        # client actually requested it (handled by the connection_upgrade map).
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # ---- Block common probes ----
    location ~ /\.(git|env|svn|hg) { deny all; return 403; }
    location ~ \.(asp|aspx|php|php5|php7)$ { deny all; return 403; }
}
