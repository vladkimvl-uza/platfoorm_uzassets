user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =================================================================
    # Logging — JSON format, easy to ingest by SIEM
    # =================================================================
    # Sanitize URI before logging: strip any `access_token=…`, `token=…`,
    # `refresh_token=…`, `api_key=…`, `code=…` query params. Defends against
    # accidental token-in-URL leaks (3rd-party redirects, legacy clients).
    # Named captures (head, key, tail) — nginx map regex doesn't support
    # numeric backrefs reliably inside the replacement, so use named groups.
    map $request_uri $sanitized_uri {
        default $request_uri;
        "~*^(?<sa_head>[^?]*\?.*?)(?<sa_key>access_token|refresh_token|token|api_key|secret|code)=[^&]*(?<sa_tail>(?:&.*)?)$"
            "$sa_head$sa_key=[REDACTED]$sa_tail";
    }
    log_format json_combined escape=json '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$sanitized_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"'
    '}';
    access_log /var/log/nginx/access.log json_combined;

    # =================================================================
    # Performance / safety
    # =================================================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    keepalive_requests 200;
    server_tokens   off;            # strip "Server: nginx/x.y.z"
    client_max_body_size 25m;
    client_body_buffer_size 128k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;
    types_hash_max_size 4096;

    # =================================================================
    # TLS — modern profile (TLS 1.2+ only)
    # =================================================================
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers            "TLS13-AES-256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256:TLS13-AES-128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_ecdh_curve         X25519:secp384r1:prime256v1;
    ssl_session_timeout    1d;
    ssl_session_cache      shared:SSL:10m;
    ssl_session_tickets    off;

    # =================================================================
    # Compression
    # =================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript text/xml
        application/xml application/xml+rss text/javascript application/wasm
        image/svg+xml;
    # gzip is vulnerable to BREACH on responses containing user-controlled
    # secrets — disable for the auth endpoints
    gzip_disable "MSIE [1-6]\.";

    # =================================================================
    # Rate limit zones — applied per server block
    # =================================================================
    limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
    # SPA сессия делает 30-60 parallel calls на page-load (KPI strip, finance
    # snapshot, baseline fallbacks, sector benchmark). 300r/m + burst=50 — мало.
    # Бампаем до 1200r/m (= 20r/s); default-status meanwhile: 429 вместо 503.
    limit_req_zone $binary_remote_addr zone=api_zone:20m   rate=1200r/m;
    limit_req_zone $binary_remote_addr zone=heavy_zone:10m rate=60r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # =================================================================
    # Host filtering: intentionally NONE.
    # server_name _; in default.conf accepts any Host header. This is the
    # right behaviour behind a corporate intranet where the same nginx
    # may be reached via uzassets006, IP, FQDN, or other internal aliases.
    # =================================================================

    # WebSocket upgrade: Vite HMR sends Connection:upgrade for /ws but
    # Connection:close (or keep-alive) for the rest. We use a map so the
    # proxied request only switches into upgrade mode when the client
    # actually requested an upgrade — otherwise normal HTTP works.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
